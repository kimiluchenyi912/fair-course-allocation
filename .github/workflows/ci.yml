name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FCA_ARTIFACT_ROOT: ${{ runner.temp }}/fair-course-allocation-artifacts-not-present
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm clean-clone artifact boundary
        run: test ! -e "$FCA_ARTIFACT_ROOT"
      - run: python -m pytest -q
      - run: python -m src.validation
      - run: python -m src.validation --strict-policy
